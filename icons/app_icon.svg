<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- FLEx List Migrator: list items moving from one list (back card) into
       another (front card).  Original artwork; FLET blue with an amber accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7ff2"/>
      <stop offset="1" stop-color="#1446a8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- source list, behind -->
  <rect x="92" y="34" width="128" height="140" rx="18" fill="#ffffff" fill-opacity="0.38"/>
  <rect x="112" y="50" width="84" height="12" rx="6" fill="#ffffff" fill-opacity="0.75"/>

  <!-- target list, in front: a small hierarchy -->
  <rect x="38" y="74" width="144" height="150" rx="18" fill="#ffffff"/>
  <circle cx="64" cy="106" r="9" fill="#1d63d8"/>
  <rect x="82" y="99" width="76" height="14" rx="7" fill="#9fbbe9"/>
  <circle cx="84" cy="140" r="8" fill="#0e7490"/>
  <rect x="100" y="133" width="58" height="14" rx="7" fill="#b9dbe3"/>
  <circle cx="84" cy="174" r="8" fill="#0e7490"/>
  <rect x="100" y="167" width="44" height="14" rx="7" fill="#b9dbe3"/>

  <!-- move badge -->
  <circle cx="190" cy="192" r="46" fill="#f5a524" stroke="#1a52bd" stroke-width="10"/>
  <path d="M166 192 H210 M194 175 L212 192 L194 209" fill="none" stroke="#132a57"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
